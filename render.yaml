services:
  - type: web
    name: alura-agente-santos-pegasus
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd src && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: PINECONE_API_KEY
        sync: false