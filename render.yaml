services:
  - type: web
    name: alura-agente-santos-pegasus
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd src && python vectorstore.py"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false